name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The whole point of this project: do not install what was published
      # in the last week. Nothing here publishes, so no token is in scope.
      - run: npm ci --ignore-scripts

      - run: npm run typecheck
      - run: npm run build
      - run: node --test test/*.test.js

      # Dogfooding: audit our own lockfile with the tool we just built.
      - run: node dist/cli.js --min-age 7
